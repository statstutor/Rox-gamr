<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Train Top Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0d0b1a; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { position: relative; }
  #game { container-type: size; }
  #c { display: block; width: 100%; height: 100%; outline: none; cursor: pointer; }
  button:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }

  #menu { position: fixed; inset: 0; overflow: auto; display: flex; padding: 16px; box-sizing: border-box; background: rgba(8, 5, 22, .62); touch-action: pan-y; }
  #menu .card { width: 100%; max-width: 440px; margin: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; background: rgba(20, 12, 45, .94); border: 2px solid rgba(62, 232, 255, .55); border-radius: 16px; }
  #menu section { display: flex; flex-direction: column; gap: 12px; }
  #menu[hidden], #menu section[hidden] { display: none; }
  .logo { margin: 0; text-align: center; font: 400 28px/1.1 "Bungee", system-ui, sans-serif; color: #ff7b29; text-shadow: 0 3px 0 rgba(0,0,0,.5); text-wrap: balance; }
  #menu h2 { margin: 0; text-align: center; font-size: 18px; color: #e6dcff; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 10px; background: rgba(0,0,0,.3); }
  .tab { border: 0; padding: 8px; border-radius: 7px; background: transparent; color: #bfb3e6; font: 700 14px system-ui, sans-serif; cursor: pointer; }
  .tab[aria-selected="true"] { background: #3ee8ff; color: #120a2e; }
  #accForm { display: flex; flex-direction: column; gap: 10px; }
  #menu label { display: flex; flex-direction: column; gap: 4px; font: 700 12px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #bfb3e6; }
  #menu input { font: 16px system-ui, sans-serif; padding: 10px 12px; border-radius: 8px; border: 2px solid #4b3c7a; background: #0d0b1a; color: #fff; user-select: text; -webkit-user-select: text; }
  #menu input:focus { outline: none; border-color: #3ee8ff; }
  .primary { padding: 12px; border: 0; border-radius: 10px; background: #ff7b29; color: #1a0f00; font: 800 18px system-ui, sans-serif; cursor: pointer; }
  .primary:disabled { opacity: .4; cursor: not-allowed; }
  .ghost { padding: 10px; border: 2px solid #4b3c7a; border-radius: 10px; background: rgba(20, 12, 45, .9); color: #e6dcff; font: 700 14px system-ui, sans-serif; cursor: pointer; }
  .ghost:hover, .tab:hover { background: rgba(255,255,255,.08); }
  .err { margin: 0; font-size: 14px; color: #ff8fa3; }
  .note { margin: 0; font-size: 12px; text-align: center; color: #8f84b8; }
  .skins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .skin { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 10px 6px; border: 2px solid #4b3c7a; border-radius: 12px; background: rgba(0,0,0,.25); color: #fff; font: 800 15px system-ui, sans-serif; cursor: pointer; }
  .skin[aria-pressed="true"] { border-color: #3ee8ff; background: rgba(62, 232, 255, .14); }
  .preview { width: 100%; max-width: 150px; height: auto; aspect-ratio: 150 / 130; border-radius: 8px; }
  .hello { display: flex; align-items: center; gap: 12px; }
  .hello .preview { width: 96px; flex: none; }
  .hello p { margin: 0; color: #bfb3e6; font-size: 14px; }
  .hello b { display: block; color: #fff; font-size: 20px; overflow-wrap: anywhere; }
  .hello .best { color: #ffd166; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .board { margin: 0; padding: 10px 12px 10px 32px; border-radius: 10px; background: rgba(0,0,0,.25); font-size: 14px; color: #e6dcff; font-variant-numeric: tabular-nums; }
  .board li { padding: 2px 0; }
  .board li span { float: right; color: #ffd166; }
  .board .me { color: #3ee8ff; font-weight: 700; }
  .help { margin: 0; font-size: 12px; line-height: 1.5; text-align: center; color: #8f84b8; }
  #overBtns { position: absolute; left: 50%; top: 63%; transform: translateX(-50%); display: flex; gap: 2cqh; }
  #overBtns[hidden] { display: none; }
  #overBtns button { font-size: max(13px, 3.3cqh); padding: .55em 1.1em; white-space: nowrap; }
  .btn { position: absolute; top: 10px; width: 44px; height: 44px; border-radius: 10px; border: 2px solid rgba(255,255,255,.6); background: rgba(0,0,0,.35); color: #fff; font-size: 20px; cursor: pointer; padding: 0; }
  .btn:hover { background: rgba(255,255,255,.15); }
  #pauseBtn { right: 10px; }
  #soundBtn { right: 62px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="c" tabindex="0"></canvas>
    <button id="soundBtn" class="btn" type="button" tabindex="-1" title="Sound (M)">🔊</button>
    <button id="pauseBtn" class="btn" type="button" tabindex="-1" title="Pause (P / Esc)">⏸</button>
    <div id="overBtns" hidden>
      <button id="againBtn" class="primary" type="button">Run again (Space)</button>
      <button id="menuBtn" class="ghost" type="button">Main menu</button>
    </div>
  </div>
</div>
<div id="menu">
  <div class="card">
    <h1 class="logo">Train Top Runner</h1>

    <section id="scrAccount" hidden>
      <div class="tabs" role="tablist">
        <button id="tabCreate" class="tab" type="button" role="tab">Create account</button>
        <button id="tabLogin" class="tab" type="button" role="tab">Log in</button>
      </div>
      <form id="accForm" autocomplete="off" novalidate>
        <label for="accName">Name <input id="accName" maxlength="16" placeholder="Your ninja name"></label>
        <label for="accPass">Password <input id="accPass" type="password" maxlength="32" placeholder="At least 4 characters"></label>
        <p id="accErr" class="err" hidden></p>
        <button id="accSubmit" class="primary" type="submit">Create account</button>
      </form>
      <p class="note">Accounts and scores are saved in this browser only.</p>
    </section>

    <section id="scrSkin" hidden>
      <h2>Choose your ninja</h2>
      <div class="skins">
        <button class="skin" type="button" data-skin="boy" aria-pressed="false"><canvas class="preview" data-skin="boy" width="300" height="260"></canvas>Ninja Boy</button>
        <button class="skin" type="button" data-skin="girl" aria-pressed="false"><canvas class="preview" data-skin="girl" width="300" height="260"></canvas>Ninja Girl</button>
      </div>
      <button id="skinDone" class="primary" type="button" disabled>Continue</button>
    </section>

    <section id="scrMain" hidden>
      <div class="hello">
        <canvas class="preview" data-skin="current" width="300" height="260"></canvas>
        <div><p>Ready to run,</p><b id="who"></b><p class="best">Best: <span id="menuBest">0</span> m</p></div>
      </div>
      <button id="startBtn" class="primary" type="button">Start run</button>
      <div class="row">
        <button id="skinBtn" class="ghost" type="button">Change ninja</button>
        <button id="logoutBtn" class="ghost" type="button">Log out</button>
      </div>
      <ol id="board" class="board"></ol>
      <p class="help">Jump: Space / ↑ / W · Duck: ↓ / S · Pause: P / Esc · Mute: M<br>Touch: tap the top half to jump, hold the bottom half to duck</p>
    </section>
  </div>
</div>
<script>
  // ---------- Setup ----------
  const W = 960, H = 540;          // logical game size
  const ROOF = 360;                // y of the train car roofs (where you run)
  const PX = 220;                  // runner's x position on screen
  const GRAV = 2600, JUMP_V = 920;
  const STAND_H = 64, DUCK_H = 32;
  const CLEAR = ROOF - 46;         // bottom of overhead obstacles
  const START_SPEED = 400, MAX_SPEED = 850;
  const SPEED_RAMP = 60000;        // speed creeps toward MAX over thousands of meters
  const ROCK_AT = 30000;           // 3000 m: the train ends and the rocky canyon begins
  const FOREST_AT = 70000;         // 7000 m: the canyon gives way to forest and lakes
  const COUPLER = 18;              // small gap between coupled cars (no jump needed)
  const CAR_COLORS = ["#c0392b", "#16a085", "#2e5c8a", "#d4a017", "#7d3c98", "#3d6b4a", "#b8562b"];

  const canvas = document.getElementById("c");
  let ctx = canvas.getContext("2d");
  const box = document.getElementById("game");
  let scale = 1;

  function resize() {
    let w = innerWidth, h = innerWidth * H / W;
    if (h > innerHeight) { h = innerHeight; w = innerHeight * W / H; }
    box.style.width = w + "px";
    box.style.height = h + "px";
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = canvas.width / W;
  }
  addEventListener("resize", resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- Game state ----------
  let state = "menu";    // menu | playing | paused | over
  let speed, scroll = 0, distance, cars, obs, particles, popups, speedLines, player;
  let biome = 0, forest = 0, deathT, overT = 0, shake, flash, nextMilestone, carsSinceGap, carCount, deathMsg, newBest;
  let best = 0;
  const keys = { jump: false, duckKey: false };
  const duckPointers = new Set();
  let jumpBuffer = 0;
  const duckHeld = () => keys.duckKey || duckPointers.size > 0;

  function reset() {
    speed = START_SPEED; distance = 0; biome = 0; forest = 0;
    cars = []; obs = []; particles = []; popups = []; speedLines = [];
    deathT = 0; shake = 0; flash = 0; nextMilestone = 500; carsSinceGap = 0; carCount = 0; newBest = false;
    player = { x: PX, y: ROOF, vy: 0, vx: 0, onGround: true, duck: false, coyote: 0, phase: 0, dead: false, rot: 0, spin: 0, dustT: 0 };
    cars.push(makeCar(-100, 1150, COUPLER, "train"));
    while (cars[cars.length - 1].x < W + 800) spawnCar();
  }

  function makeCar(x, w, gapAfter, kind) {
    const c = { x, w, gapAfter, kind, color: pick(CAR_COLORS), seed: Math.floor(Math.random() * 97), id: 100 + carCount++ };
    if (kind !== "train") Object.assign(c, makeRockDetail(w));
    return c;
  }

  const worldAt = x => distance + x - PX;   // screen x -> distance along the route
  const jumpGap = () => Math.max(120, Math.min(speed * 0.3 + rand(0, speed * 0.14), speed * 0.46));

  function spawnCar() {
    const last = cars[cars.length - 1];
    const x = last.x + last.w + last.gapAfter;
    const kind = worldAt(x) >= FOREST_AT ? "forest" : worldAt(x) >= ROCK_AT ? "rock" : "train";
    const w = kind === "train" ? rand(520, 860) : rand(600, 1200);
    carsSinceGap++;
    let gapAfter = COUPLER;
    if (kind !== "train") {
      gapAfter = jumpGap();                                   // rock ends at a ravine, forest at a lake
    } else if (worldAt(x + w) + COUPLER >= ROCK_AT) {
      gapAfter = jumpGap();                                   // end of the train: leap onto the rocks
    } else if (carsSinceGap >= 2 && (Math.random() < 0.5 || carsSinceGap >= 4)) {
      carsSinceGap = 0;                                       // every so often, a gap between cars
      gapAfter = jumpGap();
    }
    const car = makeCar(x, w, gapAfter, kind);
    cars.push(car);

    // Obstacles on the roof, spaced so there's always time to react
    const spacing = 60 + speed * 0.85;
    let p = x + 100 + speed * 0.45 + rand(0, 120);
    const end = x + w - (gapAfter > COUPLER ? 80 + speed * 0.4 : 30);
    const prev = obs[obs.length - 1];
    if (prev) p = Math.max(p, prev.x + prev.w + spacing);
    while (p < end - 40) {
      if (Math.random() < (kind === "train" ? 0.8 : 0.92)) addObstacle(p, end, kind);
      p += spacing + rand(0, kind === "train" ? 260 : 140);
    }
  }

  function addObstacle(x, maxEnd, kind) {
    let o;
    if (kind === "rock") {
      if (Math.random() < 0.28) {
        const w = rand(90, 150), n = Math.max(3, Math.round(w / 22));
        o = { type: "high", variant: "overhang", x, w, teeth: Array.from({ length: n }, (_, i) => i % 2 ? rand(10, 22) : rand(0, 4)) };
      } else {
        const variant = pick(["boulder", "boulder", "rocks", "bigBoulder", "spire"]);
        const size = { boulder: [54, 44], rocks: [64, 32], bigBoulder: [76, 54], spire: [38, 60] }[variant];
        o = { type: "low", variant, x, w: size[0], h: size[1] };
      }
    } else if (kind === "forest") {
      if (Math.random() < 0.22) {
        const w = rand(90, 140), leaves = [];
        for (let fy = 0; fy <= 1.001; fy += 0.08) {
          const n = Math.round(w / 22) + (fy > 0.9 ? 2 : 0);
          for (let i = 0; i <= n; i++) leaves.push([i / n + rand(-0.06, 0.06), Math.min(1, fy + rand(-0.03, 0.03)), rand(15, 22), Math.random()]);
        }
        o = { type: "high", variant: "branch", x, w, leaves };
      } else {
        const variant = pick(["log", "log", "fox", "rabbit", "deer"]);
        const size = { log: [Math.round(rand(60, 100)), 30], fox: [56, 34], rabbit: [32, 26], deer: [62, 74] }[variant];
        o = { type: "low", variant, x, w: size[0], h: size[1] };
      }
    } else if (Math.random() < 0.42) {
      const variant = Math.random() < 0.5 ? "bridge" : "sign";
      o = { type: "high", variant, x, w: variant === "bridge" ? rand(90, 150) : rand(76, 100) };
    } else {
      const variant = pick(["crate", "vent", "barrels", "crates2"]);
      const size = { crate: [44, 44], vent: [62, 30], barrels: [54, 40], crates2: [46, 66] }[variant];
      o = { type: "low", variant, x, w: size[0], h: size[1] };
    }
    o.kind = kind;
    if (x + o.w <= maxEnd) obs.push(o);
  }

  // ---------- Update ----------
  function startGame() {
    menuEl.hidden = true;
    overBtns.hidden = true;
    try { canvas.focus({ preventScroll: true }); } catch (e) {}
    reset();
    state = "playing";
    try {
      initAudio();
      if (actx) actx.resume().catch(() => {});
      startMusic();
    } catch (e) { actx = null; }
  }

  function togglePause() {
    if (state === "playing" && !player.dead) {
      state = "paused";
      if (actx) actx.suspend().catch(() => {});
    } else if (state === "paused") {
      state = "playing";
      if (actx) actx.resume().catch(() => {});
    }
    pauseBtn.textContent = state === "paused" ? "▶" : "⏸";
  }

  function isSupported() {
    const c = cars.find(c => c.x < player.x + 10 && c.x + c.w > player.x - 10);
    if (c) player.ground = c.kind;
    return !!c;
  }

  const HIT_MSG = {
    bridge: "Clobbered by an overhead!", sign: "Clobbered by an overhead!", overhang: "Smacked into a rock overhang!",
    branch: "Whacked by a low branch!", log: "Tripped over a log!", fox: "Bumped into a fox!",
    rabbit: "Tripped over a rabbit!", deer: "Ran right into a deer!",
    boulder: "Tripped over a boulder!", bigBoulder: "Crashed into a boulder!", rocks: "Tripped over the rocks!", spire: "Tripped over the rocks!",
  };

  function die(kind, o) {
    const p = player;
    p.dead = true; deathT = 0; shake = 14; flash = 1;
    stopMusic();
    if (kind === "fall") {
      deathMsg = { rock: "You fell into a ravine!", forest: "Splash! You fell into the lake!" }[p.ground] || "You fell between the cars!";
      if (p.ground === "forest") {
        for (let i = 0; i < 18; i++) particles.push({ x: p.x + rand(-10, 10), y: ROOF + 26, vx: rand(-160, 160), vy: rand(-420, -150), life: rand(0.4, 0.8), max: 0.8, color: pick(["#bfe6f5", "#fff", "#4fa3c7"]), size: rand(2, 5), grav: true });
      }
      p.vx = 0; p.spin = 2.5;
      sfxFall();
    } else {
      deathMsg = HIT_MSG[o && o.variant] || "Tripped over the cargo!";
      p.vy = -520; p.vx = -140; p.spin = -9; p.onGround = false;
      sfxCrash();
      for (let i = 0; i < 26; i++) {
        particles.push({ x: p.x + 10, y: p.y - 35, vx: rand(-350, 250), vy: rand(-450, 100), life: rand(0.4, 0.9), max: 0.9, color: pick(["#ffd166", "#ff7b29", "#fff"]), size: rand(2, 5), grav: true });
      }
    }
  }

  function gameOver() {
    state = "over"; overT = 0;
    const m = Math.floor(distance / 10);
    if (m > best) {
      best = m; newBest = true;
      if (account) { account.best = best; saveAccounts(); }
    }
  }

  function updatePlayer(dt) {
    const p = player;
    if (p.dead) {
      p.vy += GRAV * dt; p.y += p.vy * dt; p.x += p.vx * dt; p.rot += p.spin * dt;
      deathT += dt;
      if (deathT > 1.1) gameOver();
      return;
    }
    p.phase += dt * speed / 36;
    jumpBuffer -= dt; p.coyote -= dt;

    if (p.onGround && !isSupported()) { p.onGround = false; p.coyote = 0.08; p.vy = 0; }

    if (jumpBuffer > 0 && (p.onGround || p.coyote > 0)) {
      p.vy = -JUMP_V; p.onGround = false; p.coyote = 0; jumpBuffer = 0;
      sfxJump();
      dust(6);
    }
    p.duck = duckHeld();

    if (!p.onGround) {
      const g = p.duck ? GRAV * 2.6 : GRAV;   // hold duck in the air to drop faster
      const prevY = p.y;
      p.vy += g * dt; p.y += p.vy * dt;
      if (p.vy > 0 && prevY <= ROOF + 0.01 && p.y >= ROOF && isSupported()) {
        p.y = ROOF; p.vy = 0; p.onGround = true;
        dust(8);
      }
      if (p.y > ROOF + 14) return die("fall");
    } else {
      p.dustT -= dt;
      if (p.dustT <= 0) { dust(1); p.dustT = p.duck ? 0.03 : 0.12; }
    }

    // Collisions
    const h = p.duck && p.onGround ? DUCK_H : STAND_H;
    const l = p.x - 12, r = p.x + 12, top = p.y - h, bot = p.y;
    for (const o of obs) {
      if (o.x + 4 > r || o.x + o.w - 4 < l) continue;
      if (o.type === "low") {
        if (bot > ROOF - o.h + 5) return die("low", o);
      } else if (top < CLEAR) {
        return die("high", o);
      }
    }
  }

  function dust(n) {
    for (let i = 0; i < n; i++) {
      particles.push({ x: player.x - 6 + rand(-6, 6), y: ROOF - 2, vx: -speed * rand(0.2, 0.5), vy: rand(-90, -10), life: rand(0.25, 0.5), max: 0.5, color: "#d8cfe8", size: rand(2, 4) });
    }
  }

  function update(dt) {
    if (state === "menu") { scroll += 160 * dt; return; }
    if (state === "over") { overT += dt; }
    if (state === "playing") {
      if (!player.dead) speed = START_SPEED + (MAX_SPEED - START_SPEED) * (1 - Math.exp(-distance / SPEED_RAMP));
      else speed *= Math.exp(-4 * dt);
      const dx = speed * dt;
      scroll += dx;
      if (!player.dead) distance += dx;
      for (const c of cars) c.x -= dx;
      for (const o of obs) o.x -= dx;
      while (cars.length > 1 && cars[0].x + cars[0].w + cars[0].gapAfter < -200) cars.shift();
      obs = obs.filter(o => o.x + o.w > -150);
      while (cars[cars.length - 1].x < W + 800) spawnCar();
      updatePlayer(dt);
      const k = Math.min(1, Math.max(0, (distance - (ROCK_AT - 1500)) / 7000));
      biome = k * k * (3 - 2 * k);
      const f = Math.min(1, Math.max(0, (distance - (FOREST_AT - 1500)) / 7000));
      forest = f * f * (3 - 2 * f);

      if (!player.dead && distance / 10 >= nextMilestone) {
        popups.push({ text: nextMilestone + " m!" + ({ [ROCK_AT / 10]: " Into the canyon", [FOREST_AT / 10]: " Into the forest" }[nextMilestone] || ""), t: 0 });
        nextMilestone += 500;
        sfxMilestone();
      }
      if (speed > 560 && Math.random() < (speed - 500) / 900) {
        speedLines.push({ x: W + 20, y: rand(20, 340), len: rand(60, 180) });
      }
    }
    if (state !== "paused") {
      for (const s of speedLines) s.x -= speed * 1.8 * dt;
      speedLines = speedLines.filter(s => s.x + s.len > 0);
      for (const q of particles) {
        q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
        if (q.grav) q.vy += 1400 * dt;
      }
      particles = particles.filter(q => q.life > 0);
      for (const pu of popups) pu.t += dt;
      popups = popups.filter(pu => pu.t < 1.6);
      shake = Math.max(0, shake - 40 * dt);
      flash = Math.max(0, flash - 3 * dt);
    }
  }

  // ---------- Scenery ----------
  function makeLayer(n, minW, maxW, minH, maxH) {
    let x = 0; const arr = [];
    for (let i = 0; i < n; i++) {
      const w = rand(minW, maxW), h = rand(minH, maxH);
      const cols = Math.floor((w - 8) / 12), rows = Math.floor((h - 10) / 16);
      const lit = Array.from({ length: cols * rows }, () => Math.random() < 0.35);
      arr.push({ x, w, h, cols, rows, lit, antenna: Math.random() < 0.25 });
      x += w + rand(0, 14);
    }
    return { arr, len: x };
  }
  const farLayer = makeLayer(34, 50, 120, 80, 210);
  const nearLayer = makeLayer(30, 60, 130, 50, 150);
  const stars = Array.from({ length: 90 }, () => ({ x: rand(0, W), y: rand(0, 230), r: rand(0.6, 1.8), tw: rand(0, 6) }));

  // Retro striped sunset sun, pre-rendered once
  const sunCanvas = document.createElement("canvas");
  sunCanvas.width = sunCanvas.height = 240;
  (() => {
    const s = sunCanvas.getContext("2d");
    const g = s.createLinearGradient(0, 0, 0, 240);
    g.addColorStop(0, "#ffe66d"); g.addColorStop(0.55, "#ff8e53"); g.addColorStop(1, "#ff3f7f");
    s.fillStyle = g;
    s.beginPath(); s.arc(120, 120, 118, 0, Math.PI * 2); s.fill();
    for (let i = 0; i < 7; i++) {
      const y = 130 + i * 15, hgt = 2 + i * 1.3;
      s.clearRect(0, y, 240, hgt);
    }
  })();

  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, 430);
    g.addColorStop(0, skyStop(0)); g.addColorStop(0.45, skyStop(1)); g.addColorStop(0.78, skyStop(2)); g.addColorStop(1, skyStop(3));
    ctx.fillStyle = g;
    ctx.fillRect(-30, -30, W + 60, H + 60);
    for (const s of stars) {
      ctx.globalAlpha = (0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + s.tw))) * (1 - biome * 0.6) * (1 - forest);
      ctx.fillStyle = "#fff";
      const x = ((s.x - scroll * 0.01) % W + W) % W;
      ctx.fillRect(x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(sunCanvas, 600, 200);
  }

  // ---------- Rocky canyon (after 3000 m) ----------
  // Tileable mountain ridges: sums of sines whose periods divide the ridge length
  function makeRidge(L, parts) {
    return { L, parts: parts.map(([k, amp]) => ({ k, amp, ph: rand(0, Math.PI * 2) })) };
  }
  function ridgeHeight(r, x) {
    let h = 0;
    for (const p of r.parts) h += p.amp * Math.abs(Math.sin(Math.PI * p.k * x / r.L + p.ph));
    return h;
  }
  const farRidge = makeRidge(2400, [[2, 120], [5, 50], [11, 18]]);
  const nearRidge = makeRidge(1800, [[3, 70], [7, 30], [13, 10]]);

  function drawRidge(r, factor, baseY, color, snowY) {
    const off = scroll * factor;
    ctx.beginPath();
    ctx.moveTo(-30, H);
    for (let x = -30; x <= W + 30; x += 8) ctx.lineTo(x, baseY - ridgeHeight(r, x + off));
    ctx.lineTo(W + 30, H);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    if (snowY) {
      ctx.save();
      ctx.clip();
      ctx.fillStyle = "rgba(240, 244, 255, 0.85)";
      ctx.fillRect(-30, -30, W + 60, snowY + 30);
      ctx.restore();
    }
  }

  function drawMountains() {
    if (biome <= 0) return;
    const rise = (1 - biome) * 90;
    ctx.globalAlpha = biome * (1 - forest * 0.5);
    drawRidge(farRidge, 0.05, 400 + rise, "#5d6a96", 238 + rise);
    drawRidge(nearRidge, 0.14, 430 + rise, "#6e4f3e", 0);
    ctx.globalAlpha = 1;
  }

  function makeRockDetail(w) {
    const bumps = [];
    for (let bx = 14; bx < w - 14; bx += rand(16, 30)) bumps.push([bx, rand(0, 4)]);
    const jag = n => Array.from({ length: n }, (_, i) => 4 + i * 5 + rand(0, 8));
    const pebbles = Array.from({ length: Math.floor(w / 60) }, () => [rand(20, w - 20), rand(ROOF + 24, H - 10), rand(3, 7)]);
    return { bumps, jagL: jag(6), jagR: jag(6), pebbles };
  }

  function rockPath(c) {
    const x = c.x, w = c.w, step = (H + 20 - ROOF) / c.jagR.length;
    ctx.beginPath();
    ctx.moveTo(x, ROOF);
    for (const [bx, bh] of c.bumps) ctx.lineTo(x + bx, ROOF - bh);
    ctx.lineTo(x + w, ROOF);
    c.jagR.forEach((j, i) => ctx.lineTo(x + w - j, ROOF + (i + 1) * step));
    for (let i = c.jagL.length - 1; i >= 0; i--) ctx.lineTo(x + c.jagL[i], ROOF + (i + 1) * step);
    ctx.closePath();
  }

  function drawRock(c) {
    if (c.x > W + 30 || c.x + c.w < -30) return;
    rockPath(c);
    const g = ctx.createLinearGradient(0, ROOF, 0, H);
    g.addColorStop(0, "#9a7656"); g.addColorStop(0.35, "#6b4c37"); g.addColorStop(1, "#3a281c");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = "rgba(40, 24, 14, 0.45)"; ctx.lineWidth = 3;
    for (const sy of [ROOF + 38, ROOF + 82, ROOF + 128]) {
      ctx.beginPath();
      ctx.moveTo(c.x - 10, sy);
      for (let sx = 0; sx <= c.w + 20; sx += 40) ctx.lineTo(c.x + sx, sy + Math.sin((sx + c.id * 37) * 0.05) * 5);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(30, 18, 10, 0.5)";
    for (const [px, py, r] of c.pebbles) { ctx.beginPath(); ctx.arc(c.x + px, py, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    // sunlit crust along the top
    ctx.strokeStyle = "#c49a6c"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(c.x + 2, ROOF + 1);
    for (const [bx, bh] of c.bumps) ctx.lineTo(c.x + bx, ROOF - bh + 1);
    ctx.lineTo(c.x + c.w - 2, ROOF + 1);
    ctx.stroke();
  }

  function drawRockLow(o) {
    const x = o.x, y = ROOF - o.h;
    if (o.variant === "boulder" || o.variant === "bigBoulder") {
      ctx.fillStyle = "#7d6a5a";
      ctx.beginPath();
      ctx.moveTo(x, ROOF); ctx.lineTo(x + 4, y + 14); ctx.lineTo(x + 16, y + 2); ctx.lineTo(x + o.w - 14, y);
      ctx.lineTo(x + o.w - 2, y + 16); ctx.lineTo(x + o.w, ROOF); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#9c8774";
      ctx.beginPath(); ctx.moveTo(x + 8, y + 14); ctx.lineTo(x + 18, y + 5); ctx.lineTo(x + o.w - 16, y + 3); ctx.lineTo(x + o.w / 2, y + 14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#4a3c31"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + o.w / 2, y + 16); ctx.lineTo(x + o.w / 2 + 6, ROOF - 8); ctx.stroke();
    } else if (o.variant === "rocks") {
      const r = [[0.2, 13], [0.55, 17], [0.85, 11]];
      for (const [fx, rad] of r) {
        ctx.fillStyle = "#6f5d4f";
        ctx.beginPath(); ctx.arc(x + o.w * fx, ROOF - rad + 2, rad, Math.PI, 0); ctx.fill();
        ctx.fillStyle = "#94806d";
        ctx.beginPath(); ctx.arc(x + o.w * fx - rad * 0.3, ROOF - rad * 1.2 + 2, rad * 0.35, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      // tall rock spire
      ctx.fillStyle = "#857263";
      ctx.beginPath();
      ctx.moveTo(x, ROOF); ctx.lineTo(x + 8, y + 22); ctx.lineTo(x + o.w * 0.45, y); ctx.lineTo(x + o.w - 6, y + 16); ctx.lineTo(x + o.w, ROOF);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#a8927f";
      ctx.beginPath(); ctx.moveTo(x + 9, y + 24); ctx.lineTo(x + o.w * 0.45, y + 2); ctx.lineTo(x + o.w * 0.4, ROOF - 4); ctx.closePath(); ctx.fill();
    }
  }

  function drawOverhang(o) {
    const x = o.x, w = o.w;
    ctx.fillStyle = "#5a4535";
    ctx.beginPath();
    ctx.moveTo(x - 30, -30);
    ctx.lineTo(x + w + 30, -30);
    ctx.lineTo(x + w + 18, 150);
    ctx.lineTo(x + w + 4, 250);
    const n = o.teeth.length;
    o.teeth.forEach((d, i) => ctx.lineTo(x + w - (i + 0.5) * w / n, CLEAR - d));
    ctx.lineTo(x - 4, 250);
    ctx.lineTo(x - 18, 150);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#3d2e23";
    ctx.beginPath();
    ctx.moveTo(x - 4, 250); ctx.lineTo(x + w + 4, 250);
    o.teeth.forEach((d, i) => ctx.lineTo(x + w - (i + 0.5) * w / n, CLEAR - d));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(196, 154, 108, 0.5)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 18, 150); ctx.lineTo(x - 4, 250); ctx.stroke();
  }

  // ---------- Forest (after 7000 m) ----------
  const hexArr = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const lerpArr = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const rgb = a => `rgb(${a.map(Math.round).join(", ")})`;
  const SKY = {
    city:   ["#120a2e", "#3b1a5c", "#a83a6e", "#ff8c5a"].map(hexArr),
    canyon: ["#1b2a52", "#3f5d8f", "#c9845a", "#ffc27a"].map(hexArr),
    forest: ["#25496b", "#5b8db0", "#e8b07a", "#ffd9a0"].map(hexArr),
  };
  const skyStop = i => rgb(lerpArr(lerpArr(SKY.city[i], SKY.canyon[i], biome), SKY.forest[i], forest));

  function makeTrees(minH, maxH) {
    const arr = [];
    let x = 0;
    while (x < 2000) { const h = rand(minH, maxH); arr.push({ x, h }); x += rand(18, 55); }
    return { arr, len: x };
  }
  const farTrees = makeTrees(70, 140), nearTrees = makeTrees(120, 210);

  function drawTreeLayer(layer, factor, base, color) {
    const off = (scroll * factor) % layer.len;
    ctx.fillStyle = color;
    for (let k = 0; k < 3; k++) {
      for (const tr of layer.arr) {
        const tx = tr.x - off + k * layer.len, w = tr.h * 0.42;
        if (tx + w < -10 || tx - w > W + 10) continue;
        ctx.fillRect(tx - 3, base - tr.h * 0.25, 6, tr.h * 0.25 + 4);
        for (let tier = 0; tier < 3; tier++) {
          const top = base - tr.h + tier * tr.h * 0.22, bot = top + tr.h * 0.5, tw = w * (0.6 + tier * 0.22);
          ctx.beginPath(); ctx.moveTo(tx, top); ctx.lineTo(tx + tw, bot); ctx.lineTo(tx - tw, bot); ctx.closePath(); ctx.fill();
        }
      }
    }
    ctx.fillRect(-30, base, W + 60, H - base + 30);
  }

  function drawTrees() {
    if (forest <= 0) return;
    const rise = (1 - forest) * 120;
    ctx.globalAlpha = forest;
    drawTreeLayer(farTrees, 0.1, 418 + rise, "#2f5a3c");
    drawTreeLayer(nearTrees, 0.26, 446 + rise, "#1c3a28");
    ctx.globalAlpha = 1;
  }

  // Lakes fill the gaps between stretches of forest ground
  function drawLakes(t) {
    for (const c of cars) {
      if (c.kind !== "forest" || c.gapAfter <= COUPLER) continue;
      const x0 = c.x + c.w - 40, x1 = c.x + c.w + c.gapAfter + 40, top = ROOF + 26;
      if (x0 > W || x1 < 0) continue;
      const g = ctx.createLinearGradient(0, top, 0, H);
      g.addColorStop(0, "#4fa3c7"); g.addColorStop(1, "#123a52");
      ctx.fillStyle = g;
      ctx.fillRect(x0, top, x1 - x0, H - top + 30);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.55)"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = x0 + 50; x < x1 - 50; x += 28) {
        const y = top + 8 + ((x * 7) % 30), wob = Math.sin(t * 3 + x) * 4;
        ctx.moveTo(x + wob, y); ctx.lineTo(x + 14 + wob, y);
      }
      ctx.stroke();
      ctx.fillStyle = "#3f8f4a";
      for (let x = x0 + 70; x < x1 - 60; x += 64) {
        ctx.beginPath(); ctx.ellipse(x, top + 3, 9, 3.5, 0, 0.3, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawForestGround(c) {
    if (c.x > W + 30 || c.x + c.w < -30) return;
    rockPath(c);
    const g = ctx.createLinearGradient(0, ROOF, 0, H);
    g.addColorStop(0, "#6b4a2b"); g.addColorStop(1, "#2e1f12");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "rgba(150, 140, 120, 0.55)";
    for (const [px, py, r] of c.pebbles) { ctx.beginPath(); ctx.ellipse(c.x + px, py, r + 2, r, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = "rgba(40, 24, 10, 0.5)"; ctx.lineWidth = 2;
    for (let rx = c.x + 40; rx < c.x + c.w - 30; rx += 150) {
      ctx.beginPath(); ctx.moveTo(rx, ROOF + 12); ctx.quadraticCurveTo(rx + 20, ROOF + 40, rx + 8, ROOF + 70); ctx.stroke();
    }
    ctx.restore();
    // grass along the top
    ctx.fillStyle = "#4f8a3a";
    ctx.fillRect(c.x, ROOF - 2, c.w, 12);
    ctx.strokeStyle = "#6fb04f"; ctx.lineWidth = 2;
    ctx.beginPath();
    for (const [bx] of c.bumps) {
      ctx.moveTo(c.x + bx, ROOF); ctx.lineTo(c.x + bx - 3, ROOF - 7);
      ctx.moveTo(c.x + bx + 6, ROOF); ctx.lineTo(c.x + bx + 8, ROOF - 5);
    }
    ctx.stroke();
  }

  function drawForestLow(o, t) {
    const x = o.x, w = o.w, h = o.h, step = Math.sin(t * 14) * 3;
    ctx.lineCap = "round";
    if (o.variant === "log") {
      ctx.fillStyle = "#6e4526"; rr(x, ROOF - h, w, h, h / 2); ctx.fill();
      ctx.strokeStyle = "#4a2c16"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let lx = x + 18; lx < x + w - 10; lx += 16) { ctx.moveTo(lx, ROOF - h + 6); ctx.lineTo(lx + 8, ROOF - h + 10); }
      ctx.stroke();
      ctx.fillStyle = "#d1a46e"; ctx.beginPath(); ctx.ellipse(x + 8, ROOF - h / 2, 7, h / 2 - 1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#9c7244"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(x + 8, ROOF - h / 2, 3.5, h / 4, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (o.variant === "fox") {
      ctx.strokeStyle = "#2b1a10"; ctx.lineWidth = 3;
      ctx.beginPath();
      for (const lx of [x + 14, x + 22, x + 34, x + 42]) { ctx.moveTo(lx, ROOF - 14); ctx.lineTo(lx + (lx % 2 ? step : -step), ROOF); }
      ctx.stroke();
      ctx.fillStyle = "#d9772b";
      ctx.beginPath(); ctx.ellipse(x + w - 8, ROOF - 22, 12, 6, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + w - 1, ROOF - 27, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#d9772b";
      ctx.beginPath(); ctx.ellipse(x + 28, ROOF - 18, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 10, ROOF - 24, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 4, ROOF - 28); ctx.lineTo(x + 6, h ? ROOF - h : 0); ctx.lineTo(x + 11, ROOF - 30); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 12, ROOF - 30); ctx.lineTo(x + 16, ROOF - h); ctx.lineTo(x + 18, ROOF - 28); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 4, ROOF - 26); ctx.lineTo(x - 4, ROOF - 21); ctx.lineTo(x + 6, ROOF - 19); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(x + 26, ROOF - 13, 10, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#111"; ctx.fillRect(x + 6, ROOF - 27, 2, 2); ctx.fillRect(x - 4, ROOF - 22, 2, 2);
    } else if (o.variant === "rabbit") {
      const hop = Math.max(0, Math.sin(t * 8)) * 4;
      ctx.fillStyle = "#9a8f86";
      ctx.beginPath(); ctx.ellipse(x + 18, ROOF - 10 - hop, 12, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 8, ROOF - 17 - hop, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 7, ROOF - h + 4 - hop, 2.5, 7, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 12, ROOF - h + 5 - hop, 2.5, 7, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + w - 2, ROOF - 12 - hop, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#111"; ctx.fillRect(x + 4, ROOF - 19 - hop, 2, 2);
    } else {
      // deer
      ctx.strokeStyle = "#5e3b20"; ctx.lineWidth = 4;
      ctx.beginPath();
      for (const [lx, s] of [[x + 20, step], [x + 26, -step], [x + 46, -step], [x + 52, step]]) { ctx.moveTo(lx, ROOF - 34); ctx.lineTo(lx + s, ROOF); }
      ctx.stroke();
      ctx.fillStyle = "#9b6a3e";
      ctx.beginPath(); ctx.ellipse(x + 36, ROOF - 40, 22, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#9b6a3e"; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(x + 20, ROOF - 44); ctx.lineTo(x + 12, ROOF - 60); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x + 8, ROOF - 61, 9, 6, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#5e3b20"; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x + 10, ROOF - 66); ctx.lineTo(x + 6, ROOF - h); ctx.moveTo(x + 8, ROOF - 70); ctx.lineTo(x + 2, ROOF - 72);
      ctx.moveTo(x + 14, ROOF - 66); ctx.lineTo(x + 18, ROOF - h + 1); ctx.moveTo(x + 16, ROOF - 70); ctx.lineTo(x + 22, ROOF - 72);
      ctx.stroke();
      ctx.fillStyle = "#e9dcc6";
      ctx.beginPath(); ctx.arc(x + 58, ROOF - 44, 4, 0, Math.PI * 2); ctx.fill();
      for (const [sx, sy] of [[30, 44], [38, 46], [44, 40]]) { ctx.beginPath(); ctx.arc(x + sx, ROOF - sy, 1.8, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = "#111"; ctx.fillRect(x + 4, ROOF - 63, 2, 2);
    }
    ctx.lineCap = "butt";
  }

  // A low, leafy tree canopy hanging across the path
  function drawBranch(o) {
    const x = o.x, w = o.w, span = CLEAR - 14 + 30;
    ctx.strokeStyle = "#3d2614"; ctx.lineWidth = 16; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x + w + 60, -30); ctx.quadraticCurveTo(x + w * 0.7, 140, x + w * 0.2, CLEAR - 40); ctx.stroke();
    ctx.lineCap = "butt";
    const shades = ["#2a5e30", "#357a3a", "#3f8a42", "#2f6b34"];
    for (const [fx, fy, r, c] of o.leaves) {
      ctx.fillStyle = fy > 0.9 ? shades[2 + (c > 0.5 ? 1 : 0)] : shades[Math.floor(c * 4)];
      ctx.beginPath(); ctx.arc(x + fx * w, -30 + fy * span, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "rgba(255, 220, 140, 0.18)";
    for (const [fx, fy, r, c] of o.leaves) {
      if (c < 0.75) continue;
      ctx.beginPath(); ctx.arc(x + fx * w - r * 0.3, -30 + fy * span - r * 0.3, r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawLayer(layer, factor, base, color, windows) {
    const off = (scroll * factor) % layer.len;
    ctx.fillStyle = color;
    for (let k = 0; k < 3; k++) {
      for (const b of layer.arr) {
        const bx = b.x - off + k * layer.len;
        if (bx > W || bx + b.w < 0) continue;
        ctx.fillStyle = color;
        ctx.fillRect(bx, base - b.h, b.w, b.h + 140);
        if (b.antenna) ctx.fillRect(bx + b.w / 2 - 1, base - b.h - 18, 2, 18);
        if (windows) {
          ctx.fillStyle = "rgba(255, 210, 122, 0.75)";
          for (let r = 0; r < b.rows; r++) for (let c = 0; c < b.cols; c++) {
            if (b.lit[r * b.cols + c]) ctx.fillRect(bx + 6 + c * 12, base - b.h + 8 + r * 16, 5, 7);
          }
        }
      }
    }
  }

  function drawPoles() {
    const gap = 300, f = 0.6;
    const off = (scroll * f) % gap;
    ctx.strokeStyle = "#0b0814"; ctx.fillStyle = "#0b0814"; ctx.lineWidth = 1.5;
    const tops = [];
    for (let x = -off - gap; x < W + gap; x += gap) {
      ctx.fillRect(x - 3, 236, 6, 240);
      ctx.fillRect(x - 22, 246, 44, 5);
      tops.push(x);
    }
    for (let i = 0; i < tops.length - 1; i++) {
      for (const dy of [0, 8]) {
        const a = tops[i], b = tops[i + 1];
        ctx.beginPath();
        ctx.moveTo(a + (dy ? 18 : -18), 246 + dy * 0.2);
        ctx.quadraticCurveTo((a + b) / 2, 268 + dy, b + (dy ? 18 : -18), 246 + dy * 0.2);
        ctx.stroke();
      }
    }
  }

  function drawTrack() {
    ctx.fillStyle = "#130d1e";
    ctx.fillRect(-30, 425, W + 60, 140);
    ctx.fillStyle = "#2a2233";
    ctx.fillRect(-30, 498, W + 60, 70);
    ctx.fillStyle = "#4a3628";
    const off = scroll % 34;
    for (let x = -off - 34; x < W + 34; x += 34) ctx.fillRect(x, 500, 20, 7);
    ctx.fillStyle = "#8a8fa0"; ctx.fillRect(-30, 494, W + 60, 5);
    ctx.fillStyle = "#c9cede"; ctx.fillRect(-30, 494, W + 60, 1.5);
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawWheel(cx, cy) {
    ctx.fillStyle = "#15151c";
    ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#6d7285"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.stroke();
    const a = scroll / 13;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 9, cy + Math.sin(a) * 9); ctx.lineTo(cx - Math.cos(a) * 9, cy - Math.sin(a) * 9);
    ctx.moveTo(cx + Math.cos(a + 1.57) * 9, cy + Math.sin(a + 1.57) * 9); ctx.lineTo(cx - Math.cos(a + 1.57) * 9, cy - Math.sin(a + 1.57) * 9);
    ctx.stroke();
  }

  function drawCar(c) {
    const x = c.x, w = c.w, top = ROOF;
    if (x > W + 30 || x + w + c.gapAfter < -30) return;
    // coupler to the next car
    if (c.gapAfter === COUPLER) {
      ctx.fillStyle = "#111";
      ctx.fillRect(x + w - 4, top + 84, COUPLER + 8, 9);
      ctx.fillStyle = "#2c2c36";
      ctx.fillRect(x + w, top + 20, COUPLER, 64);
    }
    // underframe, bogies, wheels
    ctx.fillStyle = "#1c1c24";
    ctx.fillRect(x + 16, top + 104, w - 32, 10);
    for (const bx of [x + 80, x + w - 80]) {
      ctx.fillStyle = "#24242e";
      ctx.fillRect(bx - 48, top + 112, 96, 9);
      drawWheel(bx - 28, top + 121);
      drawWheel(bx + 28, top + 121);
    }
    // body
    ctx.fillStyle = c.color;
    rr(x, top + 6, w, 100, 6); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(x, top + 78, w, 28);
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.fillRect(x, top + 68, w, 5);
    // windows
    let i = 0;
    for (let wx = x + 28; wx < x + w - 50; wx += 46, i++) {
      if (wx + 30 < -10 || wx > W + 10) continue;
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(wx - 2, top + 22, 34, 34);
      ctx.fillStyle = (i * 7 + c.seed) % 5 ? "#ffe08a" : "#2b2f45";
      ctx.fillRect(wx, top + 24, 30, 30);
    }
    // car number
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.font = "bold 14px system-ui, sans-serif";
    ctx.fillText("RX " + c.id, x + 16, top + 95);
    // roof
    ctx.fillStyle = "#b8bcc8";
    ctx.fillRect(x - 2, top, w + 4, 9);
    ctx.fillStyle = "#7b8091";
    ctx.fillRect(x - 2, top + 7, w + 4, 3);
    ctx.fillStyle = "#9da2b1";
    for (let rx = x + 10; rx < x + w - 10; rx += 26) {
      if (rx > -10 && rx < W + 10) ctx.fillRect(rx, top + 3, 14, 2);
    }
  }

  function drawLow(o) {
    const x = o.x, y = ROOF - o.h;
    if (o.variant === "crate" || o.variant === "crates2") {
      const boxes = o.variant === "crate" ? [[x, y, o.w, o.h]] : [[x, ROOF - 34, o.w, 34], [x + 5, y, o.w - 10, o.h - 34]];
      for (const [bx, by, bw, bh] of boxes) {
        ctx.fillStyle = "#a8692b"; ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = "#5c3a16"; ctx.lineWidth = 3;
        ctx.strokeRect(bx + 1.5, by + 1.5, bw - 3, bh - 3);
        ctx.beginPath(); ctx.moveTo(bx + 3, by + 3); ctx.lineTo(bx + bw - 3, by + bh - 3);
        ctx.moveTo(bx + bw - 3, by + 3); ctx.lineTo(bx + 3, by + bh - 3); ctx.stroke();
      }
    } else if (o.variant === "vent") {
      ctx.fillStyle = "#8e98a8"; rr(x, y, o.w, o.h, 4); ctx.fill();
      ctx.fillStyle = "#5b6475"; ctx.fillRect(x + 4, y + 4, o.w - 8, 4);
      const cx = x + o.w / 2, cy = y + o.h / 2 + 3;
      ctx.fillStyle = "#3a404d"; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#c3cad6"; ctx.lineWidth = 2;
      const a = performance.now() / 60;
      ctx.beginPath();
      for (let k = 0; k < 3; k++) { const b = a + k * 2.09; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(b) * 9, cy + Math.sin(b) * 9); }
      ctx.stroke();
    } else {
      for (const bx of [x, x + o.w / 2]) {
        ctx.fillStyle = "#2f7d4f"; rr(bx + 1, y, o.w / 2 - 2, o.h, 5); ctx.fill();
        ctx.fillStyle = "#1d5233";
        ctx.fillRect(bx + 1, y + 9, o.w / 2 - 2, 3); ctx.fillRect(bx + 1, y + o.h - 12, o.w / 2 - 2, 3);
        ctx.fillStyle = "#ffd166"; ctx.font = "bold 12px system-ui"; ctx.fillText("⚠", bx + 8, y + 27);
      }
    }
  }

  function hazard(x, y, w, h) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = "#f5c518"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#111";
    for (let sx = x - h; sx < x + w + h; sx += 18) {
      ctx.beginPath(); ctx.moveTo(sx, y + h); ctx.lineTo(sx + 9, y + h); ctx.lineTo(sx + 9 + h, y); ctx.lineTo(sx + h, y); ctx.fill();
    }
    ctx.restore();
  }

  function drawHigh(o, t) {
    const x = o.x, w = o.w;
    if (o.variant === "bridge") {
      ctx.fillStyle = "#2a2f3d"; ctx.fillRect(x - 10, -30, w + 20, 150);      // deck / abutment above
      ctx.fillStyle = "#3b4252";
      ctx.fillRect(x - 10, 112, w + 20, 14);                                 // top chord
      ctx.fillRect(x - 10, 284, w + 20, 16);                                 // bottom chord
      ctx.fillRect(x - 10, 112, 10, 188); ctx.fillRect(x + w, 112, 10, 188);
      ctx.strokeStyle = "#5d6b82"; ctx.lineWidth = 6;
      ctx.beginPath();
      const n = Math.max(2, Math.round(w / 45)), step = w / n;
      for (let k = 0; k < n; k++) {
        ctx.moveTo(x + k * step, k % 2 ? 126 : 284);
        ctx.lineTo(x + (k + 1) * step, k % 2 ? 284 : 126);
      }
      ctx.stroke();
      ctx.fillStyle = "#6f7d96"; ctx.fillRect(x - 10, 112, w + 20, 3);
      hazard(x - 10, 300, w + 20, CLEAR - 300);
      const on = Math.sin(t * 10) > 0;
      ctx.fillStyle = on ? "#ff3344" : "#5a1018";
      ctx.beginPath(); ctx.arc(x - 2, 296, 5, 0, Math.PI * 2); ctx.arc(x + w + 2, 296, 5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = "#9aa3b5"; ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(x + 12, -10); ctx.lineTo(x + 12, 250); ctx.moveTo(x + w - 12, -10); ctx.lineTo(x + w - 12, 250); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#3b4252"; ctx.fillRect(x - 6, 120, w + 12, 12);
      ctx.fillRect(x - 6, 240, w + 12, 10);
      hazard(x, 250, w, CLEAR - 250);
      ctx.fillStyle = "#111"; ctx.fillRect(x + 8, 262, w - 16, 26);
      ctx.fillStyle = "#ffd166"; ctx.font = "bold 18px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.fillText("DUCK", x + w / 2, 282); ctx.textAlign = "left";
    }
  }

  // ---------- Runner ----------
  function limb(ax, ay, l1, a1, l2, a2) {
    const kx = ax + Math.sin(a1) * l1, ky = ay + Math.cos(a1) * l1;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(kx, ky);
    ctx.lineTo(kx + Math.sin(a2) * l2, ky + Math.cos(a2) * l2); ctx.stroke();
  }

  const SKINS = {
    boy:  { suit: "#3b4377", limb: "#4a538f", back: "#262b52", band: "#e63946", belt: "#e63946", hair: null },
    girl: { suit: "#7a2f8f", limb: "#8d3aa5", back: "#4a1a5c", band: "#ff4fa0", belt: "#ff4fa0", hair: "#1a0f12" },
  };

  // Draws a ninja with feet at (0, 0). pose: run | air | slide
  function drawRunner(pose, ph, t, skinId) {
    const sk = SKINS[skinId] || SKINS.boy;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    let hip, sh, head;
    ctx.lineWidth = 7; ctx.strokeStyle = sk.back;
    if (pose === "slide") {
      hip = [0, -10]; sh = [-14, -20]; head = [-19, -25];
      limb(hip[0], hip[1], 14, 0.9, 14, 2.4); limb(sh[0], sh[1], 12, -0.8, 11, -0.5);
    } else if (pose === "air") {
      hip = [0, -30]; sh = [4, -52]; head = [7, -61];
      limb(hip[0], hip[1], 15, -0.6, 15, -1.7); limb(sh[0], sh[1], 11, -2.3, 10, -1.6);
    } else {
      hip = [0, -30]; sh = [4, -52]; head = [7, -61];
      const b = ph + Math.PI;
      limb(hip[0], hip[1], 15, Math.sin(b) * 0.85, 15, Math.sin(b) * 0.85 - (0.2 + 1.3 * Math.max(0, Math.cos(b))));
      limb(sh[0], sh[1], 11, -Math.sin(b) * 0.9, 10, -Math.sin(b) * 0.9 + 1.4);
    }
    // katana strapped across the back
    const dx = sh[0] - hip[0], dy = sh[1] - hip[1], len = Math.hypot(dx, dy);
    const nx = dy / len * 7, ny = -dx / len * 7;   // offset toward the back
    const at = k => [hip[0] + dx * k + nx, hip[1] + dy * k + ny];
    let a = at(-0.15), b = at(1.1);
    ctx.strokeStyle = "#c9ced8"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    a = at(1.1); b = at(1.4);
    ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    // ponytail
    if (sk.hair) {
      ctx.strokeStyle = sk.hair; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(head[0] - 6, head[1] - 5);
      for (let i = 1; i <= 4; i++) ctx.lineTo(head[0] - 6 - i * 5, head[1] - 4 + i * 2.5 + Math.sin(t * 16 - i) * i);
      ctx.stroke();
    }
    // headband tails
    ctx.strokeStyle = sk.band; ctx.lineWidth = 2.5;
    for (const o of [0, 1]) {
      ctx.beginPath(); ctx.moveTo(head[0] - 8, head[1] - 4);
      for (let i = 1; i <= 3; i++) ctx.lineTo(head[0] - 8 - i * 5, head[1] - 4 + o * 3 + i * 0.8 + Math.sin(t * 20 - i + o * 2) * 1.6);
      ctx.stroke();
    }
    // torso and belt
    ctx.strokeStyle = sk.suit; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(sh[0], sh[1]); ctx.stroke();
    ctx.strokeStyle = sk.belt; ctx.lineWidth = 12.5; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.moveTo(hip[0] + dx * 0.12, hip[1] + dy * 0.12); ctx.lineTo(hip[0] + dx * 0.26, hip[1] + dy * 0.26); ctx.stroke();
    ctx.lineCap = "round";
    // hooded head with an eye slit
    ctx.fillStyle = sk.suit;
    ctx.beginPath(); ctx.arc(head[0], head[1], 9, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(head[0], head[1], 9, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = "#f5c99b"; ctx.fillRect(head[0] - 1, head[1] - 3, 11, 5);
    ctx.fillStyle = sk.band; ctx.fillRect(head[0] - 10, head[1] - 7, 20, 3);
    ctx.restore();
    ctx.fillStyle = "#111";
    ctx.fillRect(head[0] + 3, head[1] - 2, 2, 2.5); ctx.fillRect(head[0] + 7, head[1] - 2, 2, 2.5);
    // front limbs
    ctx.strokeStyle = sk.limb; ctx.lineWidth = 7;
    if (pose === "slide") {
      limb(hip[0], hip[1], 14, 1.45, 14, 1.4); limb(sh[0], sh[1], 12, 2.2, 10, 2.6);
    } else if (pose === "air") {
      limb(hip[0], hip[1], 15, 1.0, 15, -0.3); limb(sh[0], sh[1], 11, 2.4, 10, 2.9);
    } else {
      limb(hip[0], hip[1], 15, Math.sin(ph) * 0.85, 15, Math.sin(ph) * 0.85 - (0.2 + 1.3 * Math.max(0, Math.cos(ph))));
      limb(sh[0], sh[1], 11, -Math.sin(ph) * 0.9, 10, -Math.sin(ph) * 0.9 + 1.4);
    }
  }

  function drawPlayer(t) {
    const p = player;
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.dead) { ctx.translate(0, -32); ctx.rotate(p.rot); ctx.translate(0, 32); }
    const running = state === "playing" || state === "paused";
    const pose = p.dead ? "run" : p.duck && p.onGround ? "slide" : !p.onGround ? "air" : "run";
    drawRunner(pose, running ? p.phase : 0.3, t, account ? account.skin : "boy");
    ctx.restore();
  }

  // Animated ninja previews in the menu
  function drawPreviews(t) {
    const main = ctx;
    for (const cv of document.querySelectorAll(".preview")) {
      if (!cv.offsetParent) continue;
      const id = cv.dataset.skin === "current" ? (account && account.skin) || "boy" : cv.dataset.skin;
      ctx = cv.getContext("2d");
      ctx.setTransform(2, 0, 0, 2, 0, 0);
      const g = ctx.createLinearGradient(0, 0, 0, 130);
      g.addColorStop(0, "#3b1a5c"); g.addColorStop(1, "#a83a6e");
      ctx.fillStyle = g; ctx.fillRect(0, 0, 150, 130);
      ctx.fillStyle = "#b8bcc8"; ctx.fillRect(0, 108, 150, 6);
      ctx.fillStyle = id === "girl" ? "#16a085" : "#c0392b"; ctx.fillRect(0, 114, 150, 16);
      ctx.save(); ctx.translate(72, 108); ctx.scale(1.35, 1.35);
      drawRunner("run", t * 13, t, id);
      ctx.restore();
    }
    ctx = main;
  }

  // ---------- HUD & overlays ----------
  function text(str, x, y, size, color = "#fff", align = "center") {
    ctx.font = `800 ${size}px system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillText(str, x + 2, y + 3);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
    ctx.textAlign = "left";
  }

  function panel(h) {
    ctx.fillStyle = "rgba(8, 5, 22, 0.55)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(20, 12, 45, 0.85)";
    rr(W / 2 - 290, H / 2 - h / 2, 580, h, 18); ctx.fill();
    ctx.strokeStyle = "rgba(62, 232, 255, 0.6)"; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawUI(t) {
    if (state !== "menu") {
      text(Math.floor(distance / 10) + " m", 22, 46, 34, "#fff", "left");
      text("BEST " + best + " m", 24, 74, 16, "#ffd166", "left");
    }
    for (const pu of popups) {
      ctx.globalAlpha = Math.max(0, 1 - pu.t / 1.6);
      text(pu.text, W / 2, 120 - pu.t * 30, 42, "#3ee8ff");
      ctx.globalAlpha = 1;
    }
    if (state === "playing" && distance < 1200 && !player.dead) {
      ctx.globalAlpha = Math.min(1, (1200 - distance) / 300);
      text("SPACE / ↑ jump    ↓ duck    P pause", W / 2, 160, 20, "#fff");
      ctx.globalAlpha = 1;
    }
    if (state === "menu") {
      // the HTML menu covers the canvas
    } else if (state === "paused") {
      panel(180);
      text("PAUSED", W / 2, H / 2 - 18, 56, "#ffd166");
      text("Press P / Esc or tap to resume", W / 2, H / 2 + 40, 20, "#e6dcff");
    } else if (state === "over") {
      panel(270);
      text("WIPEOUT!", W / 2, H / 2 - 72, 58, "#ff4d6d");
      text(deathMsg, W / 2, H / 2 - 30, 20, "#e6dcff");
      text(Math.floor(distance / 10) + " m", W / 2, H / 2 + 22, 44, "#fff");
      text(newBest ? "★ NEW BEST! ★" : "Best: " + best + " m", W / 2, H / 2 + 56, 20, "#ffd166");
    }
  }

  function render(t) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    drawSky(t);
    ctx.globalAlpha = 1 - biome;
    if (biome < 1) {
      drawLayer(farLayer, 0.08, 420, "#2a1640", false);
      drawLayer(nearLayer, 0.22, 432, "#1a0f2b", true);
      drawPoles();
    }
    ctx.globalAlpha = 1;
    drawMountains();
    drawTrees();
    if (biome < 1) {
      ctx.globalAlpha = 1 - biome;     // the tracks fade away so canyon holes show the scenery behind
      drawTrack();
      ctx.globalAlpha = 1;
    }
    drawLakes(t);
    for (const c of cars) c.kind === "rock" ? drawRock(c) : c.kind === "forest" ? drawForestGround(c) : drawCar(c);
    for (const o of obs) {
      if (o.type !== "low" || o.x > W + 20 || o.x + o.w < -20) continue;
      o.kind === "rock" ? drawRockLow(o) : o.kind === "forest" ? drawForestLow(o, t) : drawLow(o);
    }
    drawPlayer(t);
    for (const o of obs) if (o.type === "high" && o.x < W + 60 && o.x + o.w > -60) o.variant === "overhang" ? drawOverhang(o) : o.variant === "branch" ? drawBranch(o) : drawHigh(o, t);
    for (const q of particles) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 2;
    ctx.beginPath();
    for (const s of speedLines) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.len, s.y); }
    ctx.stroke();
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
    drawUI(t);
  }

  // ---------- Audio: fast-paced synth soundtrack (Web Audio, no files) ----------
  let actx = null, master, musicGain, sfxGain, noiseBuf;
  let muted = load("trainRunnerMuted") === "1";
  const soundBtn = document.getElementById("soundBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  soundBtn.textContent = muted ? "🔇" : "🔊";

  function initAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { buildAudio(new AC()); } catch (e) { actx = null; }
  }

  function buildAudio(ac) {
    actx = ac;
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.9;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp).connect(actx.destination);
    musicGain = actx.createGain(); musicGain.gain.value = 0.55; musicGain.connect(master);
    sfxGain = actx.createGain(); sfxGain.gain.value = 0.6; sfxGain.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function toggleMute() {
    muted = !muted;
    save("trainRunnerMuted", muted ? "1" : "0");
    soundBtn.textContent = muted ? "🔇" : "🔊";
    if (master) try { master.gain.setTargetAtTime(muted ? 0 : 0.9, actx.currentTime, 0.02); } catch (e) {}
  }

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function tone(type, freq, t, dur, peak, out, cutoff, endFreq) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (cutoff) {
      const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff;
      o.connect(f); node = f;
    }
    node.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  }

  function noise(t, dur, peak, type, freq, out) {
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = actx.createGain();
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }

  const kick = t => tone("sine", 160, t, 0.22, 0.95, musicGain, 0, 42);
  const snare = (t, v = 1) => { noise(t, 0.14, 0.42 * v, "highpass", 1200, musicGain); tone("triangle", 200, t, 0.08, 0.25 * v, musicGain); };
  const hat = (t, open) => noise(t, open ? 0.12 : 0.035, open ? 0.12 : 0.07, "highpass", 7500, musicGain);
  const crash = t => noise(t, 1.1, 0.14, "highpass", 4000, musicGain);

  function bass(m, t, dur) {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = "sawtooth"; o.frequency.value = mtof(m);
    f.type = "lowpass"; f.Q.value = 6;
    f.frequency.setValueAtTime(1600, t); f.frequency.exponentialRampToValueAtTime(260, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g).connect(musicGain);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function lead(m, t, dur) {
    for (const det of [-9, 9]) {
      const o = tone("sawtooth", mtof(m), t, dur, 0.06, musicGain, 3200);
      o.detune.value = det;
    }
  }

  // A minor: Am - F - C - G, the classic driving progression
  const CHORDS = [
    { b: 45, a: [69, 72, 76, 81] },
    { b: 41, a: [65, 69, 72, 77] },
    { b: 48, a: [67, 72, 76, 79] },
    { b: 43, a: [67, 71, 74, 79] },
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 0, 1, 2, 3, 2, 1, 0, 2, 1, 3];
  const MELODY = [  // one note per 8th, 0 = rest
    81, 0, 79, 81, 0, 76, 0, 72,
    77, 0, 76, 77, 0, 72, 0, 69,
    76, 0, 74, 76, 0, 79, 0, 84,
    83, 0, 81, 79, 0, 74, 0, 71,
  ];

  const music = { timer: null, step: 0, next: 0 };
  const bpm = () => 150 + 30 * Math.min(1, Math.max(0, (speed - START_SPEED) / (MAX_SPEED - START_SPEED)));

  function playStep(s, t) {
    const bar = Math.floor(s / 16), i = s % 16, ch = CHORDS[bar % 4];
    const section = Math.floor(bar / 4) % 4;   // 0 = intro groove, 1-3 = melody, 3 = melody up an octave
    const dur = 60 / bpm() / 4;
    if (i === 0 && bar % 4 === 0) crash(t);
    if (i % 4 === 0) kick(t);
    if (i === 4 || i === 12) snare(t);
    if (bar % 4 === 3 && i >= 12) snare(t, 0.35 + (i - 12) * 0.15);   // drum fill into the next phrase
    hat(t, i % 4 === 2);
    bass(ch.b + (i % 2 ? 12 : 0), t, dur * 0.9);
    tone("square", mtof(ch.a[ARP[i]]), t, dur * 0.8, section === 0 ? 0.05 : 0.035, musicGain, 2600);
    if (section > 0 && i % 2 === 0) {
      const m = MELODY[(bar % 4) * 8 + i / 2];
      if (m) lead(m + (section === 3 ? 12 : 0), t, dur * 1.9);
    }
  }

  function scheduleMusic() {
    if (!actx) return;
    try { scheduleSteps(); } catch (e) { stopMusic(); }
  }
  function scheduleSteps() {
    if (music.next < actx.currentTime - 0.1) music.next = actx.currentTime + 0.02;
    while (music.next < actx.currentTime + 0.15) {
      playStep(music.step, music.next);
      music.next += 60 / bpm() / 4;
      music.step++;
    }
  }

  function startMusic() {
    if (!actx) return;
    stopMusic();
    music.step = 0;
    music.next = actx.currentTime + 0.06;
    scheduleMusic();
    music.timer = setInterval(scheduleMusic, 25);
  }
  function stopMusic() { clearInterval(music.timer); music.timer = null; }

  function sfxJump() { if (actx) try { tone("square", 330, actx.currentTime, 0.14, 0.12, sfxGain, 2500, 720); } catch (e) {} }
  function sfxCrash() {
    if (!actx) return;
    try { crashSound(); } catch (e) {}
  }
  function crashSound() {
    const t = actx.currentTime;
    noise(t, 0.5, 0.7, "lowpass", 1400, sfxGain);
    tone("sawtooth", 220, t, 0.6, 0.25, sfxGain, 1200, 40);
  }
  function sfxFall() { if (actx) try { tone("triangle", 700, actx.currentTime, 0.9, 0.25, sfxGain, 0, 70); } catch (e) {} }
  function sfxMilestone() {
    if (!actx) return;
    try { milestoneSound(); } catch (e) {}
  }
  function milestoneSound() {
    const t = actx.currentTime;
    tone("square", 880, t, 0.1, 0.1, sfxGain, 4000);
    tone("square", 1320, t + 0.09, 0.18, 0.1, sfxGain, 4000);
  }

  // ---------- Input ----------
  const JUMP_KEYS = ["Space", "ArrowUp", "KeyW"], DUCK_KEYS = ["ArrowDown", "KeyS"];

  function pressJump() {
    if (state === "over" && overT > 0.5) startGame();
    else if (state === "paused") togglePause();
    else if (state === "playing") jumpBuffer = 0.12;
  }

  document.addEventListener("keydown", e => {
    const k = e.code;
    if (state === "menu" || e.target.tagName === "INPUT") return;
    if (JUMP_KEYS.includes(k) || DUCK_KEYS.includes(k)) e.preventDefault();
    if (k === "KeyP" || k === "Escape") { if (!e.repeat) togglePause(); return; }
    if (k === "KeyM") { if (!e.repeat) toggleMute(); return; }
    if (JUMP_KEYS.includes(k)) { keys.jump = true; if (!e.repeat) pressJump(); }
    if (DUCK_KEYS.includes(k)) keys.duckKey = true;
  });
  document.addEventListener("keyup", e => {
    if (JUMP_KEYS.includes(e.code)) keys.jump = false;
    if (DUCK_KEYS.includes(e.code)) keys.duckKey = false;
  });

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { canvas.focus({ preventScroll: true }); } catch (err) {}
    if (state === "menu") return;
    if (state !== "playing") { if (state === "paused") togglePause(); else pressJump(); return; }
    const r = canvas.getBoundingClientRect();
    if ((e.clientY - r.top) / r.height > 0.5) duckPointers.add(e.pointerId);
    else pressJump();
  });
  const release = e => duckPointers.delete(e.pointerId);
  addEventListener("pointerup", release);
  addEventListener("pointercancel", release);
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  pauseBtn.addEventListener("click", () => { togglePause(); pauseBtn.blur(); });
  soundBtn.addEventListener("click", () => { initAudio(); toggleMute(); soundBtn.blur(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "playing" && !player.dead) togglePause(); });

  // ---------- Accounts & menus ----------
  const ACC_KEY = "trainRunnerAccounts", CUR_KEY = "trainRunnerCurrent";
  let accounts = {};
  try { accounts = JSON.parse(load(ACC_KEY) || "{}") || {}; } catch (e) { accounts = {}; }
  let account = null, accMode = "create", pickedSkin = null;
  const $ = id => document.getElementById(id);
  const menuEl = $("menu"), overBtns = $("overBtns");
  const screens = { account: $("scrAccount"), skin: $("scrSkin"), main: $("scrMain") };

  function saveAccounts() { save(ACC_KEY, JSON.stringify(accounts)); }

  async function hashPass(name, pass) {
    const data = "train-top-runner:" + name.toLowerCase() + ":" + pass;
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (e) {
      let h = 2166136261;
      for (let i = 0; i < data.length; i++) { h ^= data.charCodeAt(i); h = Math.imul(h, 16777619); }
      return "fnv" + (h >>> 0).toString(16);
    }
  }

  function showScreen(name) {
    stopMusic();
    if (state !== "menu") reset();
    state = "menu";
    menuEl.hidden = false;
    overBtns.hidden = true;
    pauseBtn.textContent = "⏸";
    for (const k in screens) screens[k].hidden = k !== name;
    if (name === "account") { setAccMode(accMode); $("accName").focus(); }
    if (name === "skin") {
      pickedSkin = account && account.skin;
      updateSkinButtons();
    }
    if (name === "main") {
      $("who").textContent = account.name;
      $("menuBest").textContent = account.best || 0;
      const top = Object.values(accounts).sort((a, b) => (b.best || 0) - (a.best || 0)).slice(0, 5);
      $("board").replaceChildren(...top.map(a => {
        const li = document.createElement("li");
        li.textContent = a.name;
        if (a === account) li.className = "me";
        const sc = document.createElement("span");
        sc.textContent = (a.best || 0) + " m";
        li.appendChild(sc);
        return li;
      }));
      $("startBtn").focus();
    }
  }

  function setAccMode(mode) {
    accMode = mode;
    $("tabCreate").setAttribute("aria-selected", mode === "create");
    $("tabLogin").setAttribute("aria-selected", mode === "login");
    $("accSubmit").textContent = mode === "create" ? "Create account" : "Log in";
    $("accErr").hidden = true;
  }

  function accError(msg) { const el = $("accErr"); el.textContent = msg; el.hidden = false; }

  function login(key) {
    account = accounts[key];
    best = account.best || 0;
    save(CUR_KEY, key);
    $("accPass").value = "";
    showScreen(account.skin ? "main" : "skin");
  }

  $("tabCreate").addEventListener("click", () => setAccMode("create"));
  $("tabLogin").addEventListener("click", () => setAccMode("login"));
  $("accForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("accName").value.trim(), pass = $("accPass").value;
    if (name.length < 2) return accError("Your name needs at least 2 characters.");
    if (pass.length < 4) return accError("Your password needs at least 4 characters.");
    const key = name.toLowerCase(), hash = await hashPass(name, pass);
    if (accMode === "create") {
      if (accounts[key]) return accError("That name is already taken on this device. Log in, or pick another name.");
      accounts[key] = { name, hash, skin: null, best: 0 };
      saveAccounts();
    } else {
      const a = accounts[key];
      if (!a) return accError("There's no account with that name yet. Create one first.");
      if (a.hash !== hash) return accError("That password doesn't match. Try again.");
    }
    login(key);
  });

  function updateSkinButtons() {
    for (const b of document.querySelectorAll(".skin")) b.setAttribute("aria-pressed", b.dataset.skin === pickedSkin);
    $("skinDone").disabled = !pickedSkin;
  }
  for (const b of document.querySelectorAll(".skin")) {
    b.addEventListener("click", () => { pickedSkin = b.dataset.skin; updateSkinButtons(); });
  }
  $("skinDone").addEventListener("click", () => {
    account.skin = pickedSkin;
    saveAccounts();
    showScreen("main");
  });
  $("startBtn").addEventListener("click", startGame);
  $("skinBtn").addEventListener("click", () => showScreen("skin"));
  $("logoutBtn").addEventListener("click", () => {
    account = null; best = 0;
    save(CUR_KEY, "");
    $("accName").value = "";
    accMode = "login";
    showScreen("account");
  });
  $("againBtn").addEventListener("click", startGame);
  $("menuBtn").addEventListener("click", () => showScreen("main"));

  // ---------- Main loop ----------
  reset();
  const remembered = load(CUR_KEY);
  if (remembered && accounts[remembered]) login(remembered);
  else { accMode = Object.keys(accounts).length ? "login" : "create"; showScreen("account"); }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state !== "paused") update(dt);
    render(now / 1000);
    if (state === "menu") drawPreviews(now / 1000);
    const showOver = state === "over" && overT > 0.5;
    if (overBtns.hidden === showOver) overBtns.hidden = !showOver;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
